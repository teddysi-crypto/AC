name: Deploy Vite to GitHub Pages

on:
  push:
    branches: ['main', 'master'] # 同時支援 main 與 master 分支

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # 關鍵修正：加入 --legacy-peer-deps 徹底避免 npm Arborist 檢查 peer dependencies 時報 edgesOut 錯誤
        run: npm install --legacy-peer-deps

      - name: Build
        # 關鍵修正 2：加入 CI=false，防止 TypeScript 或 Lint 警告（Warnings）被誤判成 Fatal Error
        run: CI=false npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
